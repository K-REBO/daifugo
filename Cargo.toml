[workspace]
resolver = "3"
members = ["crates/daifugo-host", "crates/daifugo-cli", "crates/daifugo-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
steel-core = "=0.8.3"
wasm-bindgen = "=0.2.130"
serde_json = "1"
daifugo-host = { path = "crates/daifugo-host" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# wasm は サイズ優先
[profile.wasm]
inherits = "release"
opt-level = "s"

# テストを速くするため、依存（Steel の VM）は開発ビルドでも最適化する
[profile.dev.package."*"]
opt-level = 3
