<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大富豪 - Lisp Rule Engine</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="ブラウザベースの大富豪ゲーム with 動的Lispルールエンジン">
    <meta name="theme-color" content="#059669">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="大富豪">
    <meta name="msapplication-TileColor" content="#059669">
    
    <!-- Manifest -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Icons (Data URLs for now) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23059669'/><text y='50' x='50' text-anchor='middle' dominant-baseline='middle' font-size='60'>🎴</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23059669'/><text y='50' x='50' text-anchor='middle' dominant-baseline='middle' font-size='60'>🎴</text></svg>">
    
    <!-- CSS -->
    <link href="./css/output.css" rel="stylesheet">
    <link href="./css/responsive.css" rel="stylesheet">
</head>
<body class="game-table">
    <div class="container mx-auto">
        <header class="text-center py-4 flex-shrink-0">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2">大富豪</h1>
            <p class="text-white/80 text-sm md:text-base">Powered by Lisp Rule Engine</p>
        </header>
        
        <!-- Game Area -->
        <div id="game-container" class="max-w-6xl mx-auto flex flex-col" style="height: calc(100vh - 140px);">
            <!-- CPU Players at top (flexible height) -->
            <div id="players-area" class="flex-shrink-0 overflow-y-auto" style="max-height: 30vh; min-height: 120px;"></div>
            
            <!-- Spacer to push center and bottom down -->
            <div class="flex-grow"></div>
            
            <!-- Field (center) - fixed position from bottom -->
            <div id="field-area" class="player-area text-center mb-4 flex-shrink-0">
                <h3 class="text-white font-semibold mb-4">場</h3>
                <div id="field-cards" class="flex justify-center space-x-2 min-h-24">
                    <!-- Field cards will be rendered here -->
                </div>
                <div id="game-status" class="text-white/80 mt-2">
                    ゲーム開始を待っています...
                </div>
            </div>
            
            <!-- Human Player Area - anchored to bottom -->
            <div id="human-player" class="player-area flex-shrink-0 pb-4">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-white font-semibold">あなた</h3>
                    <span id="human-card-count" class="text-white/80">手札: 0枚</span>
                </div>
                <div id="human-cards" class="flex justify-center space-x-1 mb-4 min-h-24">
                    <!-- Human cards will be rendered here -->
                </div>
                <div class="flex justify-center space-x-4">
                    <button id="play-button" class="button-primary" disabled>出す</button>
                    <button id="pass-button" class="button-secondary" disabled>パス</button>
                </div>
            </div>
        </div>
        
        <!-- Settings Panel -->
        <div id="settings-panel" class="fixed top-4 right-4">
            <button id="settings-button" class="button-secondary">
                ⚙️ ルール設定
            </button>
        </div>
    </div>
    
    <!-- Service Worker Cleanup (temporary fix) -->
    <script>
        // Remove existing service workers that interfere with module loading
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(registration) {
                    console.log('🧹 Unregistering Service Worker:', registration.scope);
                    registration.unregister();
                });
            });
        }
        
        // Clear caches
        if ('caches' in window) {
            caches.keys().then(function(cacheNames) {
                cacheNames.forEach(function(cacheName) {
                    console.log('🗑️ Deleting cache:', cacheName);
                    caches.delete(cacheName);
                });
            });
        }
    </script>
    
    <!-- Scripts -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
