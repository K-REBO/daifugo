<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .debug-output { background: #374151; padding: 15px; border-radius: 5px; margin: 10px 0; }
        button { padding: 10px 20px; margin: 5px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .players-area { background: #4b5563; padding: 20px; border-radius: 10px; margin: 20px 0; min-height: 100px; }
    </style>
</head>
<body>
    <h1>🤖 CPU Debug Test</h1>
    
    <button onclick="testLispEngine()">Test Lisp Engine</button>
    <button onclick="testGameInitialization()">Test Game Init</button>
    <button onclick="testPlayerCreation()">Test Player Creation</button>
    <button onclick="testCPUDisplay()">Test CPU Display</button>
    
    <div id="debug-output" class="debug-output">
        <h3>Debug Output:</h3>
        <div id="output"></div>
    </div>
    
    <div id="players-area" class="players-area">
        <h3>Players Area (should show CPU players):</h3>
    </div>
    
    <script type="module">
        // Import Lisp modules
        import './js/lisp-engine.js';
        import './js/lisp-game-controller.js';
        
        let lispEngine;
        let lispController;
        
        function log(message) {
            const output = document.getElementById('output');
            const timestamp = new Date().toLocaleTimeString();
            output.innerHTML += `<div>[${timestamp}] ${message}</div>`;
            console.log(message);
        }
        
        window.testLispEngine = function() {
            log('🔍 Testing Lisp Engine...');
            try {
                lispEngine = new LispGameEngine();
                log('✅ Lisp Engine created successfully');
                
                const testResult = lispEngine.eval('(+ 1 2)');
                log(`✅ Basic test: (+ 1 2) = ${testResult}`);
            } catch (error) {
                log(`❌ Lisp Engine error: ${error.message}`);
            }
        };
        
        window.testGameInitialization = function() {
            if (!lispEngine) {
                log('❌ No Lisp engine - run basic test first');
                return;
            }
            
            log('🎮 Testing Game Initialization...');
            try {
                const initResult = lispEngine.eval('(initialize-complete-game 4)');
                log(`✅ Game initialized: ${JSON.stringify(initResult)}`);
                
                const gameState = lispEngine.eval('(get-complete-game-state)');
                log(`✅ Game state: ${JSON.stringify(gameState, null, 2)}`);
            } catch (error) {
                log(`❌ Game init error: ${error.message}`);
            }
        };
        
        window.testPlayerCreation = function() {
            if (!lispEngine) {
                log('❌ No Lisp engine - run basic test first');
                return;
            }
            
            log('👥 Testing Player Creation...');
            try {
                const allPlayers = lispEngine.eval('(get-all-players)');
                log(`✅ Players found: ${JSON.stringify(allPlayers, null, 2)}`);
                
                if (allPlayers && allPlayers.length > 0) {
                    allPlayers.forEach((player, index) => {
                        log(`Player ${index}: ${player.name} (${player.isAI ? 'CPU' : 'Human'}) - ${player.cardCount} cards`);
                    });
                } else {
                    log('❌ No players found in game state');
                }
            } catch (error) {
                log(`❌ Player creation error: ${error.message}`);
            }
        };
        
        window.testCPUDisplay = function() {
            if (!lispEngine) {
                log('❌ No Lisp engine - run basic test first');
                return;
            }
            
            log('🖥️ Testing CPU Display...');
            try {
                const playersArea = document.getElementById('players-area');
                const allPlayers = lispEngine.eval('(get-all-players)');
                
                if (!allPlayers || allPlayers.length === 0) {
                    log('❌ No players to display');
                    return;
                }
                
                // Clear existing content
                playersArea.innerHTML = '<h3>Players Area (should show CPU players):</h3>';
                
                // Create container for CPU players
                const cpuContainer = document.createElement('div');
                cpuContainer.style.display = 'grid';
                cpuContainer.style.gridTemplateColumns = 'repeat(3, 1fr)';
                cpuContainer.style.gap = '10px';
                cpuContainer.style.marginTop = '10px';
                
                let cpuCount = 0;
                allPlayers.forEach((player, index) => {
                    if (index === 0) return; // Skip human player
                    
                    const playerElement = document.createElement('div');
                    playerElement.style.background = '#374151';
                    playerElement.style.padding = '10px';
                    playerElement.style.borderRadius = '5px';
                    playerElement.style.textAlign = 'center';
                    playerElement.innerHTML = `
                        <div style="font-weight: bold;">${player.name}</div>
                        <div style="font-size: 0.8em;">手札: ${player.cardCount}枚</div>
                        <div style="font-size: 0.7em; color: #9ca3af;">${player.isAI ? 'CPU' : 'Human'}</div>
                    `;
                    
                    cpuContainer.appendChild(playerElement);
                    cpuCount++;
                });
                
                playersArea.appendChild(cpuContainer);
                log(`✅ Display test complete: ${cpuCount} CPU players shown`);
                
            } catch (error) {
                log(`❌ CPU display error: ${error.message}`);
            }
        };
        
        // Auto-run initial test
        setTimeout(() => {
            log('🎯 CPU Debug Test Started');
            log('Click buttons above to run specific tests');
        }, 100);
    </script>
</body>
</html>
