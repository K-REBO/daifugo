<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Debug</title>
    <link href="./css/output.css" rel="stylesheet">
    <link href="./css/responsive.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white p-8">
    <h1>設定画面デバッグ</h1>
    
    <button id="settings-button" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
        ⚙️ ルール設定
    </button>
    
    <div id="debug-log" class="mt-4 p-4 bg-gray-800 rounded">
        <h2>Debug Log:</h2>
        <div id="log-content"></div>
    </div>

    <script type="module">
        // Load rule settings
        import { RuleSettings } from './js/rule-settings.js';
        
        console.log('🚀 Loading rule settings...');
        
        window.ruleSettings = new RuleSettings();
        
        // Add click handler
        document.getElementById('settings-button').addEventListener('click', () => {
            console.log('🔵 Settings button clicked');
            window.ruleSettings.showSettings();
        });
        
        // Capture console logs
        const originalLog = console.log;
        const originalError = console.error;
        const logContent = document.getElementById('log-content');
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            logContent.innerHTML += '<div class="text-green-400">' + args.join(' ') + '</div>';
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            logContent.innerHTML += '<div class="text-red-400">' + args.join(' ') + '</div>';
        };
        
        console.log('✅ Debug page loaded');
    </script>
</body>
</html>
