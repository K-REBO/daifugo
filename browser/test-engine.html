<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲームエンジンテスト</title>
    <link href="./css/output.css" rel="stylesheet">
    <style>
        .test-success { color: #10b981; }
        .test-error { color: #ef4444; }
        .test-info { color: #3b82f6; }
        .test-warning { color: #f59e0b; }
        .test-section { border-left: 4px solid #374151; padding-left: 16px; margin: 16px 0; }
    </style>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8">🧪 ゲームエンジンテスト</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Test Controls -->
            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-4">テスト実行</h2>
                <div class="space-y-4">
                    <button onclick="runAllTests()" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg">
                        🚀 すべてのテストを実行
                    </button>
                    <button onclick="test8CutRule()" class="w-full bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg">
                        ✂️ 8切りルールテスト
                    </button>
                    <button onclick="testRevolutionRule()" class="w-full bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg">
                        🔄 革命ルールテスト
                    </button>
                    <button onclick="testCardValidation()" class="w-full bg-yellow-600 hover:bg-yellow-700 text-white px-4 py-2 rounded-lg">
                        🃏 カード検証テスト
                    </button>
                    <button onclick="testGameFlow()" class="w-full bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg">
                        🎮 ゲームフローテスト
                    </button>
                    <button onclick="clearResults()" class="w-full bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg">
                        🗑️ 結果をクリア
                    </button>
                </div>
            </div>
            
            <!-- Test Results -->
            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-4">テスト結果サマリー</h2>
                <div id="test-summary" class="space-y-2 text-sm">
                    <div>実行待機中...</div>
                </div>
            </div>
        </div>
        
        <!-- Detailed Results -->
        <div class="bg-gray-800 rounded-lg p-6 mt-8">
            <h2 class="text-xl font-semibold mb-4">詳細ログ</h2>
            <div id="test-results" class="space-y-1 text-sm font-mono max-h-96 overflow-y-auto"></div>
        </div>
        
        <div class="text-center mt-8">
            <a href="/" class="text-blue-400 hover:text-blue-300">🏠 メインページに戻る</a>
        </div>
    </div>

    <script type="module">
        // Import necessary modules
        import './js/card.js';
        import './js/player.js';
        import './js/game.js';
        import './js/rule-settings.js';
        
        // Global test variables
        let testResults = [];
        let gameLogic = null;
        let playerManager = null;
        let ruleSettings = null;
        
        // Initialize test environment
        window.addEventListener('load', async () => {
            await initializeTestEnvironment();
        });
        
        async function initializeTestEnvironment() {
            log('🔧 テスト環境を初期化中...', 'info');
            
            try {
                // Wait for modules to load
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Initialize rule settings
                if (window.RuleSettingsModule) {
                    ruleSettings = new window.RuleSettingsModule.RuleSettings();
                    window.ruleSettings = ruleSettings;
                    log('✅ ルール設定初期化完了', 'success');
                } else {
                    throw new Error('ルール設定モジュールが見つかりません');
                }
                
                // Create test game
                if (window.PlayerModule && window.GameModule) {
                    playerManager = new window.PlayerModule.PlayerManager(4);
                    gameLogic = new window.GameModule.GameLogic(playerManager);
                    log('✅ ゲームロジック初期化完了', 'success');
                } else {
                    throw new Error('ゲームモジュールが見つかりません');
                }
                
                log('🎯 テスト環境準備完了！', 'success');
                updateSummary();
                
            } catch (error) {
                log(`❌ 初期化エラー: ${error.message}`, 'error');
            }
        }
        
        function log(message, type = 'info') {
            const logLine = document.createElement('div');
            logLine.className = `test-${type}`;
            logLine.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('test-results').appendChild(logLine);
            console.log(message);
            
            // Scroll to bottom
            const results = document.getElementById('test-results');
            results.scrollTop = results.scrollHeight;
        }
        
        function assert(condition, message) {
            if (condition) {
                log(`✅ ${message}`, 'success');
                return true;
            } else {
                log(`❌ ${message}`, 'error');
                return false;
            }
        }
        
        function updateSummary() {
            const summary = document.getElementById('test-summary');
            const total = testResults.length;
            const passed = testResults.filter(r => r.passed).length;
            const failed = total - passed;
            
            summary.innerHTML = `
                <div class="test-info">総テスト数: ${total}</div>
                <div class="test-success">成功: ${passed}</div>
                <div class="test-error">失敗: ${failed}</div>
                <div class="test-warning">成功率: ${total > 0 ? Math.round((passed/total)*100) : 0}%</div>
            `;
        }
        
        function addTestResult(name, passed, details = '') {
            testResults.push({ name, passed, details, timestamp: new Date() });
            updateSummary();
        }
        
        // 8切りルールテスト
        window.test8CutRule = function() {
            log('🔍 8切りルールテストを開始...', 'info');
            
            try {
                // Reset game
                playerManager = new window.PlayerModule.PlayerManager(4);
                gameLogic = new window.GameModule.GameLogic(playerManager);
                
                const eightCard = new window.CardModule.Card('♠', '8');
                const testCards = [eightCard];
                
                // Test 1: 8切り検出
                const has8Cut = gameLogic.has8Cut(testCards);
                const test1 = assert(has8Cut, '8切り検出テスト');
                
                // Test 2: ルール有効性
                const ruleEnabled = gameLogic.isRuleEnabled('eight-cut');
                const test2 = assert(ruleEnabled, '8切りルール有効性テスト');
                
                // Test 3: バリデーション
                const validation = gameLogic.canPlayCards(testCards);
                const test3 = assert(validation.valid && validation.special === '8cut', '8切りバリデーションテスト');
                
                // Test 4: 実際のプレイとターン継続
                gameLogic.fieldCards = [new window.CardModule.Card('♥', 'K')];
                gameLogic.lastPlayedCards = [new window.CardModule.Card('♥', 'K')];
                
                const playerBefore = gameLogic.playerManager.getCurrentPlayerIndex();
                const playResult = gameLogic.playCards(testCards);
                const playerAfter = gameLogic.playerManager.getCurrentPlayerIndex();
                
                const test4 = assert(playResult.success && playResult.special === '8cut', '8切りプレイテスト');
                const test5 = assert(gameLogic.fieldCards.length === 0, 'フィールドクリアテスト');
                const test6 = assert(playerBefore === playerAfter, 'ターン継続テスト');
                
                const allPassed = test1 && test2 && test3 && test4 && test5 && test6;
                addTestResult('8切りルール', allPassed);
                
                log(`8切りルールテスト完了: ${allPassed ? '成功' : '失敗'}`, allPassed ? 'success' : 'error');
                
            } catch (error) {
                log(`❌ 8切りテストエラー: ${error.message}`, 'error');
                addTestResult('8切りルール', false, error.message);
            }
        };
        
        // 革命ルールテスト
        window.testRevolutionRule = function() {
            log('🔍 革命ルールテストを開始...', 'info');
            
            try {
                // Reset game
                playerManager = new window.PlayerModule.PlayerManager(4);
                gameLogic = new window.GameModule.GameLogic(playerManager);
                
                const fourCards = [
                    new window.CardModule.Card('♠', '3'),
                    new window.CardModule.Card('♥', '3'),
                    new window.CardModule.Card('♦', '3'),
                    new window.CardModule.Card('♣', '3')
                ];
                
                // Test 1: 革命検出
                const validation = gameLogic.canPlayCards(fourCards);
                const test1 = assert(validation.valid && validation.special === 'revolution', '革命検出テスト');
                
                // Test 2: 革命実行
                const initialRevolution = gameLogic.isRevolution;
                const playResult = gameLogic.playCards(fourCards);
                const afterRevolution = gameLogic.isRevolution;
                
                const test2 = assert(playResult.success && playResult.special === 'revolution', '革命実行テスト');
                const test3 = assert(initialRevolution !== afterRevolution, '革命状態変更テスト');
                
                const allPassed = test1 && test2 && test3;
                addTestResult('革命ルール', allPassed);
                
                log(`革命ルールテスト完了: ${allPassed ? '成功' : '失敗'}`, allPassed ? 'success' : 'error');
                
            } catch (error) {
                log(`❌ 革命テストエラー: ${error.message}`, 'error');
                addTestResult('革命ルール', false, error.message);
            }
        };
        
        // カード検証テスト
        window.testCardValidation = function() {
            log('🔍 カード検証テストを開始...', 'info');
            
            try {
                // Reset game
                playerManager = new window.PlayerModule.PlayerManager(4);
                gameLogic = new window.GameModule.GameLogic(playerManager);
                
                // Test 1: 空のカード
                const test1 = assert(!gameLogic.canPlayCards([]).valid, '空カード拒否テスト');
                
                // Test 2: 異なるランクのカード
                const mixedCards = [
                    new window.CardModule.Card('♠', '3'),
                    new window.CardModule.Card('♥', '4')
                ];
                const test2 = assert(!gameLogic.canPlayCards(mixedCards).valid, '異ランク拒否テスト');
                
                // Test 3: 同じランクのカード
                const sameRankCards = [
                    new window.CardModule.Card('♠', '3'),
                    new window.CardModule.Card('♥', '3')
                ];
                const test3 = assert(gameLogic.canPlayCards(sameRankCards).valid, '同ランク許可テスト');
                
                // Test 4: 強さ比較（場にカードがある場合）
                gameLogic.lastPlayedCards = [new window.CardModule.Card('♠', '4')];
                const weakCard = [new window.CardModule.Card('♥', '3')];
                const strongCard = [new window.CardModule.Card('♦', '5')];
                
                const test4 = assert(!gameLogic.canPlayCards(weakCard).valid, '弱カード拒否テスト');
                const test5 = assert(gameLogic.canPlayCards(strongCard).valid, '強カード許可テスト');
                
                const allPassed = test1 && test2 && test3 && test4 && test5;
                addTestResult('カード検証', allPassed);
                
                log(`カード検証テスト完了: ${allPassed ? '成功' : '失敗'}`, allPassed ? 'success' : 'error');
                
            } catch (error) {
                log(`❌ カード検証テストエラー: ${error.message}`, 'error');
                addTestResult('カード検証', false, error.message);
            }
        };
        
        // ゲームフローテスト
        window.testGameFlow = function() {
            log('🔍 ゲームフローテストを開始...', 'info');
            
            try {
                // Reset and start game
                playerManager = new window.PlayerModule.PlayerManager(4);
                gameLogic = new window.GameModule.GameLogic(playerManager);
                
                // Test 1: ゲーム開始
                const startResult = gameLogic.startGame();
                const test1 = assert(startResult && gameLogic.gameState === 'playing', 'ゲーム開始テスト');
                
                // Test 2: デッキ作成
                const test2 = assert(gameLogic.deck.length === 0, 'デッキ配布テスト'); // After dealing
                
                // Test 3: プレイヤーの手札
                const players = playerManager.getAllPlayers();
                const totalCards = players.reduce((sum, player) => sum + player.getHand().length, 0);
                const test3 = assert(totalCards === 54, '手札配布テスト'); // 52 + 2 jokers
                
                // Test 4: ターンシステム
                const currentPlayer = playerManager.getCurrentPlayer();
                const test4 = assert(currentPlayer !== null, '現在プレイヤーテスト');
                
                // Test 5: パス機能
                const passResult = gameLogic.passTurn();
                const test5 = assert(passResult.success, 'パス機能テスト');
                
                const allPassed = test1 && test2 && test3 && test4 && test5;
                addTestResult('ゲームフロー', allPassed);
                
                log(`ゲームフローテスト完了: ${allPassed ? '成功' : '失敗'}`, allPassed ? 'success' : 'error');
                
            } catch (error) {
                log(`❌ ゲームフローテストエラー: ${error.message}`, 'error');
                addTestResult('ゲームフロー', false, error.message);
            }
        };
        
        // すべてのテストを実行
        window.runAllTests = async function() {
            log('🚀 全テスト実行を開始...', 'info');
            testResults = []; // Clear previous results
            
            await new Promise(resolve => setTimeout(resolve, 500));
            window.test8CutRule();
            
            await new Promise(resolve => setTimeout(resolve, 500));
            window.testRevolutionRule();
            
            await new Promise(resolve => setTimeout(resolve, 500));
            window.testCardValidation();
            
            await new Promise(resolve => setTimeout(resolve, 500));
            window.testGameFlow();
            
            log('🎯 全テスト実行完了！', 'success');
            updateSummary();
        };
        
        // 結果をクリア
        window.clearResults = function() {
            document.getElementById('test-results').innerHTML = '';
            testResults = [];
            updateSummary();
            log('🗑️ テスト結果をクリアしました', 'info');
        };
    </script>
</body>
</html>
